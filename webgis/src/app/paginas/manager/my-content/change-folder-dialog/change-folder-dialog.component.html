<div class="idedlg">
  <header class="idedlg-head">
    <div class="idedlg-head-left">
      <div class="idedlg-head-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          <polyline points="9 14 11 16 15 12"/>
        </svg>
      </div>
      <div class="idedlg-head-text">
        <h2 class="idedlg-title">Mudar de pasta</h2>
        <p class="idedlg-sub">Selecione a pasta de destino para este item</p>
      </div>
    </div>
    <button class="idedlg-close" (click)="onClose()" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div mat-dialog-content>
    <div class="idedlg-body">
      <mat-form-field appearance="outline">
        <mat-label>Pasta de destino</mat-label>
        <mat-select [(ngModel)]="folder" name="folder">
          <mat-option *ngFor="let folder of dataSourceFolder" [value]="folder">
            {{ folder.descricao }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div mat-dialog-actions>
    <footer class="idedlg-actions">
      <button class="idedlg-btn idedlg-btn-ghost" [mat-dialog-close]="null" type="button">Cancelar</button>
      <button class="idedlg-btn idedlg-btn-primary" [mat-dialog-close]="folder" type="button" cdkFocusInitial>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Mover
      </button>
    </footer>
  </div>
</div>
