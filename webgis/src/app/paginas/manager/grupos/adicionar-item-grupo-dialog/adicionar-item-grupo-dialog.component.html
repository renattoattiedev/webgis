<div class="idedlg">
  <header class="idedlg-head">
    <div class="idedlg-head-text">
      <h2 class="idedlg-title">Adicionar item existente ao grupo</h2>
    </div>
    <button class="idedlg-close" (click)="onClose()" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div mat-dialog-content>
    <div class="idedlg-body">
      <input type="text" class="idedlg-busca" placeholder="Buscar por título ou nome…" [(ngModel)]="busca" />

      <div class="idedlg-item-loading" *ngIf="carregando">Carregando itens…</div>
      <div class="idedlg-erro" *ngIf="erro">Não foi possível carregar os itens disponíveis.</div>
      <div class="idedlg-empty" *ngIf="!carregando && !erro && itensFiltrados.length === 0">
        Nenhum item disponível para adicionar.
      </div>

      <ul class="idedlg-lista" *ngIf="!carregando && !erro">
        <li
          class="idedlg-item"
          *ngFor="let item of itensFiltrados"
          tabindex="0"
          role="button"
          [attr.aria-label]="'Adicionar ' + item.titulo"
          (click)="selecionar(item)"
          (keydown.enter)="selecionar(item)"
          (keydown.space)="$event.preventDefault(); selecionar(item)"
        >
          <span class="idedlg-item-tipo" [attr.data-tipo]="item.tipo">{{ item.tipo }}</span>
          <span class="idedlg-item-titulo">{{ item.titulo }}</span>
        </li>
      </ul>
    </div>
  </div>
</div>
