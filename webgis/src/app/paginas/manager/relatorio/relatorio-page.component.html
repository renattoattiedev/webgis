<div class="rel-layout">

  <!-- ── Sidebar ── -->
  <aside class="rel-sidebar" [class.collapsed]="collapsed">

    <div class="rel-sidebar-top">
      <span class="rel-sidebar-title" *ngIf="!collapsed">Relatórios</span>
      <button class="rel-collapse-btn" (click)="collapsed = !collapsed"
              [title]="collapsed ? 'Expandir menu' : 'Recolher menu'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="rel-nav">
      <button class="rel-nav-item" [class.active]="secaoAtiva === 'uso'"
              (click)="mudarSecao('uso')" title="Uso do Sistema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
          <line x1="2"  y1="20" x2="22" y2="20"/>
        </svg>
        <span class="rel-nav-label" *ngIf="!collapsed">Uso do Sistema</span>
      </button>

      <button class="rel-nav-item" [class.active]="secaoAtiva === 'inventario'"
              (click)="mudarSecao('inventario')" title="Inventário de Camadas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span class="rel-nav-label" *ngIf="!collapsed">Inventário de Camadas</span>
      </button>

      <button class="rel-nav-item" [class.active]="secaoAtiva === 'usuarios'"
              (click)="mudarSecao('usuarios')" title="Usuários">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="rel-nav-label" *ngIf="!collapsed">Usuários</span>
      </button>
    </nav>

    <div class="rel-export">
      <button class="rel-export-btn rel-export-btn--csv" (click)="exportarCSV()" title="Exportar CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span *ngIf="!collapsed">Exportar CSV</span>
      </button>
      <button class="rel-export-btn rel-export-btn--pdf" (click)="exportarPDF()" title="Exportar PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span *ngIf="!collapsed">Exportar PDF</span>
      </button>
    </div>

  </aside>

  <!-- ── Conteúdo ── -->
  <main class="rel-main">
    <app-relatorio-uso        *ngIf="secaoAtiva === 'uso'"></app-relatorio-uso>
    <app-relatorio-inventario *ngIf="secaoAtiva === 'inventario'"></app-relatorio-inventario>
    <app-relatorio-usuarios   *ngIf="secaoAtiva === 'usuarios'"></app-relatorio-usuarios>
  </main>

</div>
