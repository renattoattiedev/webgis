<div class="idedlg">
  <header class="idedlg-head">
    <div class="idedlg-head-left">
      <div class="idedlg-head-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
      <div class="idedlg-head-text">
        <h2 class="idedlg-title">Editar <em>grupo</em></h2>
        <p class="idedlg-sub">Atualize o grupo de camadas</p>
      </div>
    </div>
    <button class="idedlg-close" (click)="onClose()" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div mat-dialog-content>
    <div class="idedlg-body">
      <mat-form-field appearance="outline">
        <mat-label>Nome do grupo</mat-label>
        <input matInput name="nome_tema" [(ngModel)]="data.grupoCamada.grupoNome" cdkFocusInitial>
      </mat-form-field>

      <div class="idedlg-sigla-row">
        <app-grupo-avatar-badge
          [grupos]="[{ id: 'preview', nome: data.grupoCamada.grupoNome || 'Grupo', sigla: data.grupoCamada.grupoSigla || '--' }]"
        ></app-grupo-avatar-badge>
        <mat-form-field appearance="outline" class="idedlg-sigla-field">
          <mat-label>Sigla</mat-label>
          <input matInput name="sigla" maxlength="2" [(ngModel)]="data.grupoCamada.grupoSigla" (ngModelChange)="onSiglaChange()">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Tema</mat-label>
        <mat-select name="tema" [(ngModel)]="data.grupoCamada.grupoTema">
          <mat-option *ngFor="let tema of temas" [value]="tema.id">{{ tema.tituloTema }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Dono do grupo</mat-label>
        <mat-select name="dono" [(ngModel)]="donoId">
          <mat-option *ngFor="let usuario of usuarios" [value]="usuario.id">{{ usuario.nome }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div mat-dialog-actions>
    <footer class="idedlg-actions">
      <button class="idedlg-btn idedlg-btn-ghost" (click)="onClose()" type="button">Cancelar</button>
      <button class="idedlg-btn idedlg-btn-primary" (click)="submitPacote()" [disabled]="salvando" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg> Salvar alterações</button>
    </footer>
  </div>
</div>
