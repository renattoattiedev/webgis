<div class="idedlg idedlg--danger">
  <header class="idedlg-head">
    <div class="idedlg-head-left">
      <div class="idedlg-head-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></div>
      <div class="idedlg-head-text">
        <h2 class="idedlg-title">Excluir basemap</h2>
        <p class="idedlg-sub">Esta ação não pode ser desfeita</p>
      </div>
    </div>
    <button class="idedlg-close" (click)="onClose()" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div mat-dialog-content>
    <div class="idedlg-body">
      <p>Deseja realmente excluir o basemap <strong>{{ data.basemap.name }}</strong>?</p>
    </div>
  </div>

  <div mat-dialog-actions>
    <footer class="idedlg-actions">
      <button class="idedlg-btn idedlg-btn-ghost" (click)="onClose()" type="button">Cancelar</button>
      <button class="idedlg-btn idedlg-btn-danger" [mat-dialog-close]="true" type="button" cdkFocusInitial (click)="excluir()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Sim, excluir</button>
    </footer>
  </div>
</div>
