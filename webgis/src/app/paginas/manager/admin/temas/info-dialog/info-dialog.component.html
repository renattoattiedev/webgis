<div class="idedlg">
  <header class="idedlg-head">
    <div class="idedlg-head-left">
      <div class="idedlg-head-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>
      <div class="idedlg-head-text">
        <h2 class="idedlg-title">Mensagem</h2>
        <p class="idedlg-sub">Resposta do sistema</p>
      </div>
    </div>
    <button class="idedlg-close" (click)="onClose()" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div mat-dialog-content>
    <div class="idedlg-body">
      <p>{{ data.mensagem }}</p>
    </div>
  </div>

  <div mat-dialog-actions>
    <footer class="idedlg-actions">
      <button class="idedlg-btn idedlg-btn-primary" (click)="onClose()" type="button" cdkFocusInitial>Entendi</button>
    </footer>
  </div>
</div>
