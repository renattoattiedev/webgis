<div class="sd-card">

  <div class="sd-icon sd-icon--success">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      <polyline points="9 16 11 18 15 14"/>
    </svg>
  </div>

  <h2 class="sd-title" mat-dialog-title>Senha redefinida!</h2>

  <div mat-dialog-content class="sd-content">
    <p class="sd-sub">
      Sua senha foi alterada com sucesso.<br>
      Você já pode fazer login com a nova senha.
    </p>
  </div>

  <div mat-dialog-actions class="sd-actions">
    <button class="sd-btn" [mat-dialog-close] cdkFocusInitial>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Ir para o login
    </button>
  </div>

</div>
