<div class="auth-page">
  <div class="auth-card">

    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h2 class="card-title">Nova senha</h2>
    <p class="card-sub">Crie uma senha forte para proteger sua conta</p>

    <form #resetForm="ngForm" autocomplete="off" style="text-align: left;">

      <div class="field">
        <label class="field-label" for="DSC_PASSWORD">Nova senha</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input class="field-input field-input--padded-r" #pwdInput type="password"
                 id="DSC_PASSWORD" name="DSC_PASSWORD"
                 ngModel #DSC_PASSWORD="ngModel" required
                 (input)="validatePassword(DSC_PASSWORD.value, DSC_PASSWORD_CONFIRM.value)"
                 placeholder="••••••••">
          <button type="button" class="field-eye"
                  (click)="pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="DSC_PASSWORD_CONFIRM">Confirmar nova senha</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input class="field-input field-input--padded-r" #pwdConfirmInput type="password"
                 id="DSC_PASSWORD_CONFIRM" name="DSC_PASSWORD_CONFIRM"
                 ngModel #DSC_PASSWORD_CONFIRM="ngModel" required
                 (input)="validatePassword(DSC_PASSWORD.value, DSC_PASSWORD_CONFIRM.value)"
                 placeholder="••••••••">
          <button type="button" class="field-eye"
                  (click)="pwdConfirmInput.type = pwdConfirmInput.type === 'password' ? 'text' : 'password'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="pwd-reqs">
        <div class="pwd-req" [class.pwd-req--ok]="passwordValidation.minLength">8+ caracteres</div>
        <div class="pwd-req" [class.pwd-req--ok]="passwordValidation.uppercase">Maiúscula</div>
        <div class="pwd-req" [class.pwd-req--ok]="passwordValidation.lowercase">Minúscula</div>
        <div class="pwd-req" [class.pwd-req--ok]="passwordValidation.number">Número</div>
        <div class="pwd-req" [class.pwd-req--ok]="passwordValidation.specialChar">Especial ({{ specialChars }})</div>
        <div class="pwd-req" [class.pwd-req--ok]="passwordValidation.passwordsMatch">Senhas iguais</div>
      </div>

      <button class="btn-primary" type="button"
              [disabled]="!resetForm.valid ||
                          !passwordValidation.minLength ||
                          !passwordValidation.uppercase ||
                          !passwordValidation.lowercase ||
                          !passwordValidation.number ||
                          !passwordValidation.specialChar ||
                          !passwordValidation.passwordsMatch"
              (click)="resetPassword(resetForm)">
        Redefinir senha
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

    </form>

  </div>
</div>
