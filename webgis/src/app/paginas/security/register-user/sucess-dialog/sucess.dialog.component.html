<div class="sd-card">

  <div class="sd-icon sd-icon--success">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
  </div>

  <h2 class="sd-title" mat-dialog-title>Cadastro realizado!</h2>

  <div mat-dialog-content class="sd-content">
    <p class="sd-sub">
      Seu cadastro foi concluído com sucesso.<br>
      Você já pode acessar o sistema com suas credenciais.
    </p>
  </div>

  <div mat-dialog-actions class="sd-actions">
    <button class="sd-btn" [mat-dialog-close] cdkFocusInitial>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Ir para o login
    </button>
  </div>

</div>
