<div class="auth-root">

  <!-- ── Brand panel ──────────────────────────────────────────────────────── -->
  <div class="auth-visual">
    <div class="av-content">
      <img class="av-logo" src="assets/imagens/logo2.png" alt="CESAN"/>
      <h1 class="av-title">GISCESAN</h1>
      <p class="av-sub">Sistema de Informações Geográficas</p>
      <div class="av-drop">
        <svg viewBox="0 0 80 104" fill="none">
          <path d="M40 4C40 4 6 50 6 70C6 89.9 21.6 104 40 104C58.4 104 74 89.9 74 70C74 50 40 4 40 4Z"
                fill="rgba(255,255,255,0.10)"/>
          <path d="M40 18C40 18 14 56 14 70C14 85 25.8 97 40 97"
                stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <p class="av-footer">CESAN · Companhia Espírito-Santense de Saneamento</p>
  </div>

  <!-- ── Form panel ───────────────────────────────────────────────────────── -->
  <div class="auth-form">
    <div class="af-card">

      <div class="af-head">
        <h2 class="af-title">Bem-vindo de volta</h2>
        <p class="af-sub">Entre com suas credenciais para acessar o sistema</p>
      </div>

      <form #loginForm="ngForm" autocomplete="on" (ngSubmit)="login(loginForm)">

        <div class="field-banner" [class.field-banner--visible]="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMessage }}
        </div>

        <div class="field">
          <label class="field-label" for="DSC_EMAIL">E-mail</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input class="field-input" type="email" id="DSC_EMAIL" name="DSC_EMAIL"
                   ngModel #DSC_EMAIL="ngModel" required autocomplete="email"
                   placeholder="seu@email.com">
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="DSC_PASSWORD">Senha</label>
            <a class="field-aux-link" routerLink="/recovery-password">Esqueceu a senha?</a>
          </div>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="field-input field-input--padded-r" #pwdInput type="password"
                   id="DSC_PASSWORD" name="DSC_PASSWORD"
                   ngModel #DSC_PASSWORD="ngModel" required autocomplete="current-password"
                   placeholder="••••••••">
            <button type="button" class="field-eye"
                    (click)="pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn-primary" type="submit"
          [disabled]="!loginForm.valid">
          Entrar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <div class="af-divider"><span>ou</span></div>

        <button class="btn-microsoft" type="button" (click)="loginWithMicrosoft()">
          <svg viewBox="0 0 21 21" width="18" height="18">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
          Entrar com Microsoft
        </button>

        <p class="af-alt">
          Ainda não tem conta?&nbsp;
          <a routerLink="/register-user">Criar conta</a>
        </p>

      </form>
    </div>
  </div>

</div>
