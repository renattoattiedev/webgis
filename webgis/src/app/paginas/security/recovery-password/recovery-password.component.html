<div class="auth-page">
  <div class="auth-card">

    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>

    <h2 class="card-title">Recuperar senha</h2>
    <p class="card-sub">
      Informe seu e-mail e enviaremos um link para redefinição de senha.
    </p>

    <form #recoveryForm="ngForm" autocomplete="on">

      <div class="field">
        <label class="field-label" for="DSC_EMAIL">E-mail cadastrado</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input class="field-input" type="email" id="DSC_EMAIL" name="DSC_EMAIL"
                 ngModel #DSC_EMAIL="ngModel" required autocomplete="email"
                 placeholder="seu@email.com">
        </div>
      </div>

      <button class="btn-primary" type="button"
              [disabled]="!recoveryForm.valid" (click)="recoveryPassword(recoveryForm)">
        Enviar link de recuperação
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>

    </form>

    <a class="back-link" routerLink="/login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Voltar para o login
    </a>

  </div>
</div>
