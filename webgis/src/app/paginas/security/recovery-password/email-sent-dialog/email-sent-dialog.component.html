<div class="sd-card">

  <div class="sd-icon sd-icon--info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
  </div>

  <h2 class="sd-title" mat-dialog-title>E-mail enviado!</h2>

  <div mat-dialog-content class="sd-content">
    <p class="sd-sub">
      Enviamos as instruções de recuperação de senha para o seu e-mail.<br>
      Verifique sua caixa de entrada e siga o link recebido.
    </p>
  </div>

  <div mat-dialog-actions class="sd-actions">
    <button class="sd-btn" [mat-dialog-close] cdkFocusInitial>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      OK, entendido
    </button>
  </div>

</div>
