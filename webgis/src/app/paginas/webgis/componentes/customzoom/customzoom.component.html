<div class="custom-zoom-controls">
  <button mat-icon-button class="zoom-button zoom-in" (click)="zoomIn()" [disabled]="isZooming" title="Zoom In (-1000)"
    aria-label="Zoom In">
    <mat-icon>add</mat-icon>
  </button>

  <div class="scale-ruler-simple">
    <div class="ruler-bar" (click)="onRulerClick($event)">

      <div class="ruler-marks">
        <div class="ruler-line" style="top: 95%"></div>
        <div class="ruler-line" style="top: 90%"></div>
        <div class="ruler-line" style="top: 85%"></div>
        <div class="ruler-line" style="top: 80%"></div>
        <div class="ruler-line" style="top: 75%"></div>
        <div class="ruler-line" style="top: 70%"></div>
        <div class="ruler-line" style="top: 65%"></div>
        <div class="ruler-line" style="top: 60%"></div>
        <div class="ruler-line" style="top: 55%"></div>
        <div class="ruler-line" style="top: 50%"></div>
        <div class="ruler-line" style="top: 45%"></div>
        <div class="ruler-line" style="top: 40%"></div>
        <div class="ruler-line" style="top: 35%"></div>
        <div class="ruler-line" style="top: 30%"></div>
        <div class="ruler-line" style="top: 25%"></div>
        <div class="ruler-line" style="top: 20%"></div>
        <div class="ruler-line" style="top: 15%"></div>
        <div class="ruler-line" style="top: 10%"></div>
        <div class="ruler-line" style="top: 5%"></div>
      </div>

      <div class="current-position" [style.top.%]="getCurrentPosition()">
        {{currentScale / 1000}}K
      </div>
    </div>
  </div>

  <button mat-icon-button class="zoom-button zoom-out" (click)="zoomOut()" [disabled]="isZooming"
    title="Zoom Out (+1000)" aria-label="Zoom Out">
    <mat-icon>remove</mat-icon>
  </button>
</div>
