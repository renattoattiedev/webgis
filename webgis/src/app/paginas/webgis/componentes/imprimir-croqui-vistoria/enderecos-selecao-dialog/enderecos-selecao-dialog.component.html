<div class="enderecos-dialog" cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle=".dialog-title">
  <h3 mat-dialog-title class="dialog-title">
    <mat-icon>checklist</mat-icon>
    Selecionar Endereços
  </h3>

  <div mat-dialog-content class="dialog-content list-content">
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por nome, bairro, matrícula...</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Digite para filtrar" />
      <button mat-icon-button matSuffix (click)="searchControl.setValue('')" aria-label="Limpar">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>
  <div class="resultados-header">
    <span>Resultados da busca ({{ filtered.length }} encontrados)</span>
    <div class="select-all">
      <mat-checkbox [checked]="todosSelecionados()"
                    [indeterminate]="selecionados.size>0 && !todosSelecionados()"
                    (change)="selecionarTodos()">Selecionar todos</mat-checkbox>
    </div>
  </div>

  <div class="lista">
    <div class="item" *ngFor="let r of filtered" (click)="toggle(r)">
      <div class="left">
        <mat-checkbox class="item-check" [checked]="isSelecionado(r)" (click)="$event.stopPropagation(); toggle(r)"></mat-checkbox>
      </div>
      <div class="content">
        <div class="badges">
          <span class="badge mat">MAT: {{ getMatricula(r) }}</span>
          <span class="badge hd">HD: {{ getHd(r) }}</span>
        </div>
        <div class="nome">{{ getNome(r) }}</div>
        <div class="endereco">
          <div class="logradouro">{{ getLogradouro(r) }}, Nº {{ getNumero(r) }}</div>
          <div class="bairro">Bairro: {{ getBairro(r) }}</div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button color="white" (click)="cancelar()">
    <mat-icon>close</mat-icon>
    Cancelar
  </button>
  <button mat-raised-button color="white" (click)="confirmar()">
    <mat-icon>done</mat-icon>
    Confirmar Seleção
  </button>
  </div>
</div>
