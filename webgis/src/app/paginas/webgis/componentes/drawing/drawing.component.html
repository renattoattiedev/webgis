<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<div class="panel-header">
  <div class="panel-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
            stroke="#1b5e20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="panel-label">Desenhar</span>
  </div>
</div>

<!-- ── Tipo de desenho ────────────────────────────────────────────────────── -->
<div class="field-group">
  <span class="field-label">Tipo de desenho</span>
  <div class="select-wrap">
    <mat-select [(ngModel)]="drawType" (selectionChange)="onChangeDrawType($event)" panelClass="webgis-select-panel">
      <mat-option value="Selecione">Selecione</mat-option>
      <mat-option value="Point">Ponto</mat-option>
      <mat-option value="LineString">Linha</mat-option>
      <mat-option value="Polygon">Polígono</mat-option>
      <mat-option value="Circle">Círculo</mat-option>
      <mat-option value="Arrow">Seta</mat-option>
    </mat-select>
  </div>
</div>

<!-- ── Cores ──────────────────────────────────────────────────────────────── -->
<div class="color-row">
  <div class="color-group">
    <span class="field-label">Cor da linha</span>
    <label class="color-wrap">
      <span class="color-preview" [style.background]="lineColor"></span>
      <span class="color-label">{{ lineColor }}</span>
      <input type="color" [value]="lineColor" (input)="onColorChange($event, 'line')" class="color-input"/>
    </label>
  </div>
  <div class="color-group">
    <span class="field-label">Cor de fundo</span>
    <label class="color-wrap">
      <span class="color-preview" [style.background]="fillColor"></span>
      <span class="color-label">{{ fillColor }}</span>
      <input type="color" [value]="fillColor" (input)="onColorChange($event, 'fill')" class="color-input"/>
    </label>
  </div>
</div>

<!-- ── Espessura ──────────────────────────────────────────────────────────── -->
<div class="field-group">
  <div class="slider-header">
    <span class="field-label">Espessura da linha</span>
    <span class="slider-value">{{ lineWidth }}px</span>
  </div>
  <input type="range" class="styled-range" min="1" max="10" [(ngModel)]="lineWidth" (change)="updateStyle()"/>
</div>

<!-- ── Transparência ──────────────────────────────────────────────────────── -->
<div class="field-group">
  <div class="slider-header">
    <span class="field-label">Transparência</span>
    <span class="slider-value">{{ (fillOpacity * 100).toFixed(0) }}%</span>
  </div>
  <input type="range" class="styled-range" min="0" max="1" step="0.05" [(ngModel)]="fillOpacity" (change)="updateStyle()"/>
</div>

<!-- ── Toggles ─────────────────────────────────────────────────────────────── -->
<div class="toggles">
  <div class="toggle-row" (click)="freehand = !freehand; updateDrawInteraction()">
    <span class="toggle-text">Desenho à mão livre</span>
    <div class="toggle-wrap" [class.toggle-on]="freehand">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </div>
  </div>

  <div class="toggle-row" (click)="clearPrevious = !clearPrevious; onClearPreviousChange()">
    <span class="toggle-text">Limpar anteriores</span>
    <div class="toggle-wrap" [class.toggle-on]="clearPrevious">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </div>
  </div>
</div>

<!-- ── Ação ───────────────────────────────────────────────────────────────── -->
<button class="clear-btn" (click)="clearAllDrawings()" type="button">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Limpar desenhos
</button>
