<div class="map-container" id="map"></div>
<app-current-location></app-current-location>
<app-identify></app-identify>
<app-home></app-home>
<app-zoom-envolope></app-zoom-envolope>
<app-thematic-legend-overlay></app-thematic-legend-overlay>

<!-- ── Pill bar unificada ───────────────────────────────────────────────── -->
<div class="pill-bar">

  <!-- Thumbnail do basemap (+ painel expandido flutuante) -->
  <app-basemap></app-basemap>

  <!-- Separador -->
  <div class="pill-sep"></div>

  <!-- Botão: Cortina/Comparar -->
  <button
    class="pill-btn"
    [class.pill-btn--active]="formCortinaVisible"
    (click)="toogleFormCortina()"
    title="Cortina / Comparar"
    #cortinaButton>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
      <line x1="12" y1="3" x2="12" y2="21" stroke="currentColor" stroke-width="1.7"/>
    </svg>
  </button>

  <!-- Botão: Medir -->
  <button
    class="pill-btn"
    [class.pill-btn--active]="formMeasureVisible"
    (click)="toggleFormMeasure()"
    title="Medir"
    #measureButton>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M3 21L21 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M6.5 17.5l1.8-1.8M10.5 13.5l1.8-1.8M14.5 9.5l1.8-1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Botão: Desenhar -->
  <button
    class="pill-btn"
    [class.pill-btn--active]="formDrawingVisible"
    (click)="toggleFormDrawing()"
    title="Desenhar"
    #drawingButton>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Botão: Imprimir -->
  <button
    class="pill-btn"
    [class.pill-btn--active]="formPrintingVisible"
    (click)="toggleFormPrinting()"
    title="Imprimir"
    #printingButton>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"
            stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Separador -->
  <div class="pill-sep"></div>

  <!-- Indicador de escala -->
  <app-escala></app-escala>

</div>

<!-- ── Painéis de ferramentas ───────────────────────────────────────────── -->
<div class="toolbar-container">
  <div class="cortina-form" [class.show]="formCortinaVisible" #cortinaForm>
    <app-cortina-camadas
      [availableLayers]="this.layers"
      [swipeValue]="swipeValue"
    ></app-cortina-camadas>
  </div>
  <div class="measure-form" [class.show]="formMeasureVisible" #measureForm>
    <app-measure></app-measure>
  </div>
  <div class="drawing-form" [class.show]="formDrawingVisible" #drawingForm>
    <app-drawing></app-drawing>
  </div>
  <div class="printing-form" [class.show]="formPrintingVisible" #printingForm>
    <app-printing></app-printing>
  </div>
</div>

<!-- ── Divisor vertical da cortina ───────────────────────────────────────── -->
<div
  *ngIf="formCortinaVisible && layer1 && layer2"
  class="swipe-divider"
  [style.left.%]="swipeValue"
  (mousedown)="onDividerMouseDown($event)"
  (touchstart)="onDividerTouchStart($event)"
>
  <!-- Label camada esquerda -->
  <div class="swipe-label swipe-label--left">
    {{ getLayerTitle(layer1) }}
  </div>

  <!-- Handle pill -->
  <div class="swipe-handle" [class.swipe-handle--dragging]="isDragging">
    <svg width="16" height="10" viewBox="0 0 16 10" fill="none" aria-hidden="true">
      <path d="M5 1L1 5L5 9" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 1L15 5L11 9" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="swipe-grip">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Label camada direita -->
  <div class="swipe-label swipe-label--right">
    {{ getLayerTitle(layer2) }}
  </div>
</div>
