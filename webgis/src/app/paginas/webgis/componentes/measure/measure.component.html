<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<div class="panel-header">
  <div class="panel-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 21L21 3" stroke="#1b5e20" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M6.5 17.5l1.8-1.8M10.5 13.5l1.8-1.8M14.5 9.5l1.8-1.8"
            stroke="#1b5e20" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="panel-label">Medir</span>
  </div>
</div>

<!-- ── Tipo de medida ──────────────────────────────────────────────────────── -->
<div class="field-group">
  <span class="field-label">Tipo de medida</span>
  <div class="select-wrap">
    <mat-select name="measurementType" [(ngModel)]="drawType" (selectionChange)="onTypeChange()" panelClass="webgis-select-panel">
      <mat-option value="Select">Selecionar</mat-option>
      <mat-option value="LineString">Comprimento (Linha)</mat-option>
      <mat-option value="Polygon">Área (Polígono)</mat-option>
    </mat-select>
  </div>
</div>

<!-- ── Toggles ─────────────────────────────────────────────────────────────── -->
<div class="toggles">
  <div class="toggle-row" (click)="showSegments = !showSegments; onSegmentChange()">
    <span class="toggle-text">Mostrar segmentos</span>
    <div class="toggle-wrap" [class.toggle-on]="showSegments">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </div>
  </div>

  <div class="toggle-row" (click)="clearPrevious = !clearPrevious">
    <span class="toggle-text">Limpar anteriores</span>
    <div class="toggle-wrap" [class.toggle-on]="clearPrevious">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </div>
  </div>
</div>

<!-- ── Ação ───────────────────────────────────────────────────────────────── -->
<button class="clear-btn" (click)="clearAllSegments()" type="button">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Limpar medidas
</button>
