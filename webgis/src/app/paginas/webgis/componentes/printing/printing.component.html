<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<div class="panel-header">
  <div class="panel-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"
            stroke="#01499B" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    <span class="panel-label">Imprimir</span>
  </div>
</div>

<!-- ── Opções ─────────────────────────────────────────────────────────────── -->
<div class="options-row">
  <div class="field-group">
    <span class="field-label">Formato</span>
    <div class="select-wrap">
      <mat-select [(value)]="format" panelClass="webgis-select-panel">
        <mat-option value="pdf">PDF</mat-option>
        <mat-option value="png">PNG</mat-option>
      </mat-select>
    </div>
  </div>

  <div class="field-group">
    <span class="field-label">Orientação</span>
    <div class="select-wrap">
      <mat-select [(value)]="orientation" panelClass="webgis-select-panel">
        <mat-option value="landscape">Paisagem</mat-option>
        <mat-option value="portrait">Retrato</mat-option>
      </mat-select>
    </div>
  </div>
</div>

<!-- ── Exportar ───────────────────────────────────────────────────────────── -->
<button class="export-btn" (click)="export()" type="button">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
    <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"
          stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
  Exportar mapa
</button>
