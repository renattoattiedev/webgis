<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Cartográfico</title>
    <style>
        /* ─── @page: A4 portrait como container físico ─── */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                /* altura controlada dinamicamente pelo sistema de impressão via style inline */
                overflow: hidden !important;
            }
            .page-break { display: none !important; }
            .no-print   { display: none !important; }

            /* CRÍTICO: wrapper não pode vazar além de 297mm */
            .page.croqui-wrapper {
                overflow: hidden !important;
                height: 297mm !important;
                max-height: 297mm !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            /* Isolar o bloco rotacionado do fluxo de paginação */
            .croqui-rotated {
                contain: strict !important;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #ccc;
            margin: 0;
            padding: 10mm;
        }

        @media print {
            body { padding: 0 !important; }
        }

        /* ─── Wrapper: A4 portrait (210 × 297 mm) ─── */
        .page.croqui-wrapper {
            width: 210mm;
            height: 297mm;
            overflow: hidden;
            position: relative;
            padding: 0;
            background: white;
        }

        /*
         * Técnica de rotação -90°:
         *   - O bloco interno tem dimensões landscape: 297mm × 210mm
         *   - transform-origin: top left (canto superior esquerdo)
         *   - rotate(-90deg) gira no sentido anti-horário
         *   - Após a rotação: left=0, top=297mm → encaixa em 210mm × 297mm
         */
        .croqui-rotated {
            width: 297mm;
            height: 210mm;
            position: absolute;
            top: 297mm;
            left: 0;
            transform: rotate(-90deg);
            transform-origin: top left;

            /* Layout interno landscape */
            padding: 5mm;
            display: grid;
            grid-template-columns: 1fr 60mm;
            grid-template-rows: 15mm 1fr 12mm;
            grid-template-areas:
                'header header'
                'map-area legend-area'
                'footer footer';
            gap: 3mm;
            background: white;
        }

        /* ─── CABEÇALHO ─── */
        .header {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #333;
            padding-bottom: 3mm;
        }

        .title-section { flex: 1; }

        .map-title {
            font-size: 14pt;
            font-weight: bold;
            color: #333;
            margin-bottom: 1mm;
            line-height: 1.1;
        }

        .map-subtitle {
            font-size: 9pt;
            color: #666;
            font-style: italic;
        }

        .logo-section {
            width: 45mm;
            height: 12mm;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .logo-section img { max-width: 100%; max-height: 100%; }

        /* ─── ÁREA DO MAPA ─── */
        .map-area {
            grid-area: map-area;
            border: 2px solid #333;
            position: relative;
            background: #f0f8ff;
            overflow: hidden;
        }

        /* CORREÇÃO: sem flex/center — a imagem preenche sozinha com width/height 100% */
        .map-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Coordenadas nos cantos */
        .coord-bottom-right {
            position: absolute;
            bottom: 2mm;
            right: 2mm;
            font-size: 7pt;
            color: #333;
            background: white;
            padding: 1.5mm;
            border: 1px solid #333;
            z-index: 10;
        }

        /* Seta Norte */
        .north-arrow {
            position: absolute;
            top: 8mm;
            right: 8mm;
            width: 22mm;
            height: 22mm;
            z-index: 10;
        }

        .north-arrow svg { width: 100%; height: 100%; }

        /* Escala */
        .scale-bar {
            position: absolute;
            bottom: 8mm;
            left: 8mm;
            background: white;
            border: 1px solid #333;
            padding: 2mm;
            z-index: 10;
        }

        .scale-segments { display: flex; margin-bottom: 1.5mm; }

        .scale-segment {
            width: 8mm;
            height: 3mm;
            border: 1px solid #333;
        }

        .scale-segment:nth-child(odd) { background: #333; }

        .scale-labels {
            display: flex;
            font-size: 7pt;
            justify-content: space-between;
            width: 40mm;
        }

        /* ─── LEGENDA ─── */
        .legend-area {
            grid-area: legend-area;
            border: 2px solid #333;
            padding: 3mm;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 2mm;
            overflow: hidden;
        }

        .legend-title {
            font-size: 10pt;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #666;
            padding-bottom: 2mm;
            margin-bottom: 1mm;
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 2mm;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 2mm;
        }

        .legend-symbol {
            width: 6mm;
            height: 6mm;
            border: 1px solid #333;
            flex-shrink: 0;
        }

        .legend-symbol.point { border-radius: 50%; }
        .legend-symbol.line  { height: 2mm; border: none; border-bottom: 2px solid; }

        .legend-label { font-size: 8pt; color: #333; }

        /* ─── RODAPÉ ─── */
        .footer {
            grid-area: footer;
            border-top: 1.5px solid #333;
            padding-top: 2mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 7pt;
            color: #666;
        }

        .footer-left, .footer-center, .footer-right { flex: 1; }
        .footer-center { text-align: center; }
        .footer-right  { text-align: right; }

        .footer-item  { margin: 0.5mm 0; line-height: 1.2; }
        .footer-label { font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <!-- Wrapper A4 portrait — conteúdo interno rotacionado -90° para landscape -->
    <div class="page croqui-wrapper">
        <div class="croqui-rotated">

            <!-- CABEÇALHO -->
            <div class="header">
                <div class="title-section">
                    <h1 class="map-title">{{MAP_TITLE}}</h1>
                    <p class="map-subtitle">{{MAP_SUBTITLE}}</p>
                </div>
                <div class="logo-section">
                    <img src="http://localhost:3333/wp-content/uploads/2022/12/logo.png" alt="Logo RunForrestGIS">
                </div>
            </div>

            <!-- ÁREA DO MAPA -->
            <div class="map-area">
                <div class="map-container">
                    {{MAP_CONTENT}}
                </div>

                <!-- Coordenada canto inferior direito -->
                <div class="coord-bottom-right">{{COORD_BOTTOM_RIGHT}}</div>

                <!-- Seta Norte -->
                <div class="north-arrow">
                    <svg viewBox="0 0 100 100">
                        <polygon points="50,10 60,40 55,40 55,80 45,80 45,40 40,40" fill="#333"/>
                        <text x="50" y="95" text-anchor="middle" fill="#333" font-size="20" font-weight="bold">N</text>
                    </svg>
                </div>

                <!-- Escala -->
                <div class="scale-bar">
                    <div class="scale-segments">
                        <div class="scale-segment"></div>
                        <div class="scale-segment"></div>
                        <div class="scale-segment"></div>
                        <div class="scale-segment"></div>
                        <div class="scale-segment"></div>
                    </div>
                    <div class="scale-labels">
                        <span>0</span>
                        <span>{{SCALE_1}}</span>
                        <span>{{SCALE_2}}</span>
                        <span>{{SCALE_3}}</span>
                        <span>{{SCALE_4}}</span>
                        <span>{{SCALE_5}}</span>
                    </div>
                    <div style="text-align: center; margin-top: 1.5mm; font-size: 7pt;">Escala {{SCALE}}</div>
                </div>
            </div>

            <!-- LEGENDA -->
            <div class="legend-area">
                <h2 class="legend-title">LEGENDA</h2>
                <div class="legend-items">
                    {{LEGEND_ITEMS}}
                </div>
            </div>

            <!-- RODAPÉ -->
            <div class="footer">
                <div class="footer-left">
                    <div class="footer-item"><span class="footer-label">Autor:</span> {{AUTHOR}}</div>
                    <div class="footer-item"><span class="footer-label">Data:</span> {{DATE}}</div>
                </div>
                <div class="footer-center">
                    <div class="footer-item"><span class="footer-label">Projeção:</span> {{PROJECTION}}</div>
                    <div class="footer-item"><span class="footer-label">Datum:</span> {{DATUM}}</div>
                </div>
                <div class="footer-right">
                    <div class="footer-item"><span class="footer-label">Fonte:</span> {{DATA_SOURCE}}</div>
                    <div class="footer-item"><span class="footer-label">Escala:</span> {{SCALE}}</div>
                </div>
            </div>

        </div><!-- /croqui-rotated -->
    </div><!-- /croqui-wrapper -->

</body>
</html>
